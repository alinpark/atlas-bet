# Surcouche DEMO : force les données synthétiques et l'émulateur Telegram, même si
# des clés réelles traînent dans l'environnement. À utiliser avec --env-file demo.env.
services:
  backend:
    environment:
      ODDS_PROVIDER: fixture
      THE_ODDS_API_KEY: ""
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_SIMULATOR: "true"
      TELEGRAM_ALLOWED_CHAT_IDS: "1000"
