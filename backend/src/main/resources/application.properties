spring.datasource.url=${BET_JDBC_URL:jdbc:postgresql://localhost:5432/atlas_bet}
spring.datasource.username=${BET_DB_USER:atlas_bet}
spring.datasource.password=${BET_DB_PASSWORD}
spring.security.user.name=${BET_ADMIN_USER:admin}
spring.security.user.password=${BET_ADMIN_PASSWORD}
spring.task.scheduling.pool.size=3
spring.jackson.serialization.write-dates-as-timestamps=false
server.error.include-message=never
springdoc.api-docs.path=/v3/api-docs

# Fournisseur de cotes : fixture (DEMO / SYNTHÉTIQUE) ou theoddsapi.
bet.odds.provider=${ODDS_PROVIDER:fixture}
bet.odds.api-key=${THE_ODDS_API_KEY:}
bet.odds.competitions=${SPORTS_ODDS_COMPETITIONS:}
# Budget de crédits The Odds API (offre gratuite : 500/mois). 1 crédit par compétition et
# par appel de cotes ; 2 par appel de scores (fait seulement pour les matchs prédits).
bet.odds.min-interval-minutes=${ODDS_MIN_INTERVAL_MINUTES:120}
bet.odds.scores-interval-minutes=${ODDS_SCORES_INTERVAL_MINUTES:720}
bet.odds.quota-floor=${ODDS_QUOTA_FLOOR:20}
bet.engine.url=${AI_ENGINE_URL:http://localhost:8000}
bet.engine.token=${BET_ENGINE_TOKEN:}
bet.pipeline.interval-ms=${SPORTS_COLLECT_INTERVAL_MS:300000}
bet.odds.adaptive=${ODDS_ADAPTIVE:true}
bet.odds.monthly-budget=${ODDS_MONTHLY_BUDGET:400}
bet.scheduler.enabled=${BET_SCHEDULER_ENABLED:true}

# Actualité des équipes (API-Football, offre gratuite 100 requêtes/jour) : garde-fou
# « compositions publiées » avant toute sélection réelle.
bet.news.api-key=${API_FOOTBALL_KEY:}
bet.news.daily-limit=${API_FOOTBALL_DAILY_LIMIT:90}

bet.telegram.token=${TELEGRAM_BOT_TOKEN:}
bet.telegram.allowed-chat-ids=${TELEGRAM_ALLOWED_CHAT_IDS:}
bet.telegram.simulator=${TELEGRAM_SIMULATOR:false}

logging.level.org.springframework.web.client=WARN
